name: Node.js CI

on:
  pull_request:
    branches: "main"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Syntax (Type Check)
        run: npm run type-check

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test
        env:
          NODE_ENV: test
          PORT: 5000
      - name: Run Format Check
        run: npm run format-check
