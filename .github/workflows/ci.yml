name: Node.js CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRE: 30d
      JWT_COOKIE_EXPIRE: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Syntax
        run: npm run type-check

      - name: Run Lint
        run: npm run lint

      - name: Run Jest Tests
        run: npm run test

      - name: Run Format Check
        run: npm run format-check

      - name: Verify MongoDB configuration
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "MONGO_URI secret is missing or empty"
            exit 1
          fi
          echo "MONGO_URI is configured"

      - name: Start API Server
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API Server
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/health -o /dev/null; then
              echo "API server is responding"
              exit 0
            fi

            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "API server exited unexpectedly"
              cat server.log
              exit 1
            fi

            sleep 2
          done

          echo "API server did not start in time"
          cat server.log
          exit 1

      - name: Run Newman API Tests
        run: npm run test:api

      - name: Show Server Logs on Failure
        if: failure()
        run: cat server.log || true
