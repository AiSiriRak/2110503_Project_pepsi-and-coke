info:
  name: Get All Reservations
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/reservations"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (
          res.getStatus() === 200 &&
          body.success === true &&
          Array.isArray(body.data) &&
          body.data.length > 0
        ) {
          bru.setVar("ReservationID", body.data[0]._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
