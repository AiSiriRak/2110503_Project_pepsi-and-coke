info:
  name: Get Invitation by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/invitations/:id"
  params:
    - name: id
      value: "{{InvitationID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
