info:
  name: Get User
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL}}/auth/me"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        test("Get User returns 200", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("Get User returns user data", () => {
          expect(body.success).to.equal(true);
          expect(body.data).to.be.an("object");
          expect(body.data.email).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK - Fetch Current User Success
    description: Successfully fetched current logged-in user details using Bearer token
    request:
      url: "{{URL}}/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "_id": "670d3e8f8f23a80012ab34cd",
              "name": "johndoe",
              "telephoneNumber": "0812345678",
              "email": "johndoe@example.com",
              "role": "admin",
              "createdAt": "2026-10-14T14:33:37.000Z",
              "__v": 0
            }
          }
  - name: 401 Unauthorized - Missing or Invalid Token
    description: Request failed due to missing, invalid, or expired JWT token
    request:
      url: "{{URL}}/auth/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Not authorize to access this route"
          }
  - name: 404 Not Found - User No Longer Exists
    description: Token is valid but user ID inside decoded JWT is no longer found in database
    request:
      url: "{{URL}}/auth/me"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "User not found"
          }

docs: |-
  An API to fetch details of the currently authenticated user based on the provided Bearer token.

  Authentication:
  - Requires Bearer Token in Authorization header (`{{token}}`).

  Responses:
  - 200 OK: Returns current logged-in user profile (`_id`, `name`, `email`, `telephoneNumber`, `role`, `createdAt`).
  - 401 Unauthorized: Token missing, invalid, or expired.
  - 404 Not Found: User record associated with token no longer exists.
