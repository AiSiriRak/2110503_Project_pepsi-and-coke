info:
  name: Get message limit this month
  type: http
  seq: 4

http:
  method: GET
  url: https://api.line.me/v2/bot/message/quota
  auth:
    type: bearer
    token: "{{line_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
