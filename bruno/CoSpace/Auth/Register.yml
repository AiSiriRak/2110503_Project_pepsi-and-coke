info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/auth/register"
  body:
    type: json
    data: |-
      {
          "name": "{{username}}",
          "telephoneNumber": "{{tel}}",
          "email": "{{email}}",
          "password": "{{password}}",
          "role": "user"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("username", bru.interpolate('{{$randomUserName}}'));
        bru.setVar("email", bru.interpolate('{{$randomEmail}}').toLowerCase());
        bru.setVar("password", bru.interpolate('{{$randomPassword}}'));
        bru.setVar("tel", "067-067-6767");
    - type: after-response
      code: |-
        if (res.body?.token) {
          bru.setVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
