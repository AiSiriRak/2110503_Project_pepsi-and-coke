info:
  name: Create Co-working Space
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/coworking-spaces"
  body:
    type: json
    data: |-
      {
        "name": "{{cospaceName}}",
        "address": "{{address}}",
        "telephoneNumber": "{{telephoneNumber}}",
        "openTime": "{{openTime}}",
        "closeTime": "{{closeTime}}",
        "maximumCapacity": {{maxCapacity}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Generate a Co-working space name
        bru.setVar(
          'cospaceName', 
          bru.interpolate('{{$randomCompanyName}} Space')
        );

        // Generate an address
        bru.setVar(
          'address',
          bru.interpolate('{{$randomStreetAddress}}, {{$randomCity}}')
        );

        // Generate a telephone number
        const prefixes = ['06', '08', '09'];
        const randomPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];
        const randomNumber = Math.floor(10000000 + Math.random() * 90000000);
        const thaiPhone = `${randomPrefix}${randomNumber}`;

        bru.setVar('telephoneNumber', thaiPhone);

        // Generate an opening time
        const randomOpenHour = Math.floor(Math.random() * 12) + 6;
        const openTimeStr = (Math.random() < 0.5) ? 
              `${String(randomOpenHour).padStart(2, '0')}:00`: 
              `${String(randomOpenHour).padStart(2, '0')}:30`;

        bru.setVar('openTime', openTimeStr);

        // Generate a closing time
        const randomCloseHour = Math.floor(Math.random() * 6) + 18;
        const closeTimeStr = (Math.random() < 0.5) ? 
              `${String(randomCloseHour).padStart(2, '0')}:00`: 
              `${String(randomCloseHour).padStart(2, '0')}:30`;

        bru.setVar('closeTime', closeTimeStr);

        // Generate a maximum capacity
        const maxCapacity = Math.floor(Math.random() * 15) + 1;
        bru.setVar('maxCapacity', maxCapacity);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Created - Co-working Space Created Successfully
    description: Create a new co-working space with valid randomized data
    request:
      url: "{{URL}}/coworking-spaces"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Nexus Hub Space",
            "address": "456 Phra Ram 9 Rd, Bangkok",
            "telephoneNumber": "0898765432",
            "openTime": "08:00",
            "closeTime": "22:00",
            "maximumCapacity": 15
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "_id": "670d3e8f8f23a80012ab34cd",
              "name": "Nexus Hub Space",
              "address": "456 Phra Ram 9 Rd, Bangkok",
              "telephoneNumber": "0898765432",
              "openTime": "08:00",
              "closeTime": "22:00",
              "maximumCapacity": 15,
              "createdAt": "2026-10-14T15:56:52.000Z",
              "updatedAt": "2026-10-14T15:56:52.000Z",
              "__v": 0,
              "id": "670d3e8f8f23a80012ab34cd"
            }
          }
  - name: 400 Bad Request - Validation Error
    description: Invalid field format in body (e.g. openTime does not match HH:mm Regex)
    request:
      url: "{{URL}}/coworking-spaces"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Nexus Hub Space",
            "address": "456 Phra Ram 9 Rd, Bangkok",
            "telephoneNumber": "0898765432",
            "openTime": "08.00",
            "closeTime": "22:00",
            "maximumCapacity": 15
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Please use HH:mm format for open time (e.g. 08:00)."
          }
  - name: 401 Unauthorized - Missing or Invalid Token
    description: Attempting to create a co-working space without sending a valid Bearer token
    request:
      url: "{{URL}}/coworking-spaces"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "{{cospaceName}}",
            "address": "{{address}}",
            "telephoneNumber": "{{telephoneNumber}}",
            "openTime": "{{openTime}}",
            "closeTime": "{{closeTime}}",
            "maximumCapacity": {{maxCapacity}}
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Not authorize to access this route"
          }
  - name: 403 Forbidden - Insufficient Permissions
    description: User role is 'user' instead of 'admin'
    request:
      url: "{{URL}}/coworking-spaces"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "{{cospaceName}}",
            "address": "{{address}}",
            "telephoneNumber": "{{telephoneNumber}}",
            "openTime": "{{openTime}}",
            "closeTime": "{{closeTime}}",
            "maximumCapacity": {{maxCapacity}}
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "User role user is not authorized to access this route"
          }

docs: |-
  An API to create a new Co-working Space (Admin only).

  Required Request Body Fields:
  - name: string (Name of the space)
  - address: string (Full street address)
  - telephoneNumber: string (Thai phone format, e.g. 0812345678)
  - openTime: string (Opening time in HH:mm format)
  - closeTime: string (Closing time in HH:mm format)
  - maximumCapacity: number (Maximum seating capacity)

  Automation Details:
  - Pre-request Script: Dynamically generates randomized values for testing.
