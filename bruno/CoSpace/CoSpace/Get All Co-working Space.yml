info:
  name: Get All Co-working Space
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/coworking-spaces"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 response
    description: Fetch all co-working spaces success with pagination and filtering
    request:
      url: "{{URL}}/coworking-spaces?select=name,address,telephoneNumber,maximumCapacity&sort=-createdAt&page=1&limit=10"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "412"
        - name: etag
          value: W/"19c-X7yZ8pK9qEXO13HC730eE8XfHbk0"
        - name: date
          value: Wed, 14 Oct 2026 16:00:00 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "success": true,
            "count": 1,
            "pagination": {
              "next": {
                "page": 2,
                "limit": 10
              }
            },
            "data": [
              {
                "_id": "670d3e8f8f23a80012ab34cd",
                "name": "Acme Corp Space",
                "address": "123 Sukhumvit Rd, Bangkok",
                "telephoneNumber": "0812345678",
                "openTime": "08:00",
                "closeTime": "20:00",
                "maximumCapacity": 12,
                "createdAt": "2026-10-14T14:33:37.000Z",
                "updatedAt": "2026-10-14T14:33:37.000Z",
                "__v": 0,
                "id": "670d3e8f8f23a80012ab34cd"
              }
            ]
          }
  - name: 400 response
    description: Invalid query parameter type
    request:
      url: "{{URL}}/coworking-spaces?maximumCapacity[gte]=invalid_number"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "Cast to Number failed for value \"invalid_number\" at path \"maximumCapacity\""
          }

docs: |-
  An API to fetch all Co-working Spaces with built-in support for filtering, selecting fields, sorting, and pagination.

  Query Parameters:
  - select: Comma-separated list of fields to include (e.g. ?select=name,address)
  - sort: Comma-separated list of fields to sort by (e.g. ?sort=-createdAt,name)
  - page: Page number for pagination (Default: 1)
  - limit: Maximum number of records per page (Default: 25)
  - Filtering: Supports comparison operators such as [gt], [gte], [lt], [lte], [in] (e.g. ?maximumCapacity[gte]=10)
