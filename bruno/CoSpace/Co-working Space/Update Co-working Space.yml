info:
  name: Update Co-working Space
  type: http
  seq: 4

http:
  method: PUT
  url: "{{URL}}/coworking-spaces/:id"
  params:
    - name: id
      value: "{{CoworkingSpaceID}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "{{cospaceName}}",
        "maximumCapacity": {{maxCapacity}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar(
          'cospaceName', 
          bru.interpolate('{{$randomCompanyName}} Updated Space')
        );
        const maxCapacity = Math.floor(Math.random() * 20) + 5;
        bru.setVar('maxCapacity', maxCapacity);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK - Space Updated Successfully
    description: Update specific fields of a co-working space by ID
    request:
      url: "{{URL}}/coworking-spaces/670d3e8f8f23a80012ab34cd"
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "Acme Corp Renewed Space",
            "maximumCapacity": 25
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "_id": "670d3e8f8f23a80012ab34cd",
              "name": "Acme Corp Renewed Space",
              "address": "123 Sukhumvit Rd, Bangkok",
              "telephoneNumber": "0812345678",
              "openTime": "08:00",
              "closeTime": "20:00",
              "maximumCapacity": 25,
              "createdAt": "2026-10-14T14:33:37.000Z",
              "updatedAt": "2026-10-16T02:45:00.000Z",
              "__v": 0,
              "id": "670d3e8f8f23a80012ab34cd"
            }
          }
  - name: 401 Unauthorized - Missing or Invalid Token
    description: Request failed due to missing or invalid Bearer token
    request:
      url: "{{URL}}/coworking-spaces/670d3e8f8f23a80012ab34cd"
      method: PUT
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Not authorize to access this route"
          }
  - name: 403 Forbidden - Insufficient Permissions
    description: User role is 'user' instead of 'admin'
    request:
      url: "{{URL}}/coworking-spaces/670d3e8f8f23a80012ab34cd"
      method: PUT
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "User role user is not authorized to access this route"
          }
  - name: 404 Not Found - Space Not Found
    description: Co-working space ID not found in database
    request:
      url: "{{URL}}/coworking-spaces/670d3e8f8f23a80012ab9999"
      method: PUT
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Coworking space not found with the provided ID"
          }

docs: An API to update details of an existing Co-working Space by ID (Admin only).
