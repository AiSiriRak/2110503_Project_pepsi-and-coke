info:
  name: Respond - Invalid Status
  type: http
  seq: 6

http:
  method: PUT
  url: "{{URL}}/invitations/{{invitation3Id}}"
  body:
    type: json
    data: |-
      {
        "status": "invalid"
      }
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Respond Invitation with invalid status, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Respond Invitation with invalid status returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Status must be accepted or declined");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
