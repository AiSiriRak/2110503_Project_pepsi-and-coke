info:
  name: Accept - Exceed Reservation Capacity
  type: http
  seq: 11

http:
  method: PUT
  url: "{{URL}}/invitations/{{invitation3Id}}"
  body:
    type: json
    data: |-
      {
        "status": "accepted"
      }
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Accept Invitation exceeding capacity, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Accept Invitation exceeding capacity returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal(`The reservation with ID ${bru.interpolate("{{reservationId}}")} has already have 3 bookers.`);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
