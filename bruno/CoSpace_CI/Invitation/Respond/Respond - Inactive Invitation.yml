info:
  name: Respond - Inactive Invitation
  type: http
  seq: 8

http:
  method: PUT
  url: "{{URL}}/invitations/{{invitation2Id}}"
  body:
    type: json
    data: |-
      {
        "status": "accepted"
      }
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Accept Invitation exceeding reservation limit, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Accept Invitation exceeding reservation limit returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Invitation has already been declined");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
