info:
  name: Respond - Non-recipient
  type: http
  seq: 7

http:
  method: PUT
  url: "{{URL}}/invitations/{{invitation3Id}}"
  body:
    type: json
    data: |-
      {
        "status": "accepted"
      }
  auth:
    type: bearer
    token: "{{user2Token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Respond Invitation as Non-recipient, 403 Forbidden", function () {
          expect(res.status).to.equal(403);
        });

        test("Respond Invitation as Non-recipient returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("User is not authorized to access or modify this resource");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
