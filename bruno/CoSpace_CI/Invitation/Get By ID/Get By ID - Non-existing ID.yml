info:
  name: Get By ID - Non-existing ID
  type: http
  seq: 6

http:
  method: GET
  url: "{{URL}}/invitations/000000000000000000000001"
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get Invitation with non-existing ID, 404 Not Found", function () {
          expect(res.status).to.equal(404);
        });

        test("Get Invitation with non-existing ID returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Invitation not found with ID of 000000000000000000000001");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
