info:
  name: Get By ID - Inviter
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/invitations/{{invitationId}}"
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get Invitation by ID success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        test("Get Invitation by ID returns success", function () {
          expect(res.body.success).to.equal(true);
        });

        test("Get Invitation by ID returns invitation data", function () {
          expect(res.body.data).to.be.an("object");
          expect(res.body.data).to.have.property("_id");
          expect(res.body.data).to.have.property("status");
          expect(res.body.data).to.have.property("inviter");
          expect(res.body.data).to.have.property("recipient");
          expect(res.body.data).to.have.property("reservation");
        });

        test("Invitation ID matches requested ID", function () {
          expect(res.body.data._id).to.equal(
            bru.interpolate("{{invitationId}}")
          );
        });

        test("Invitation inviter matches current user ID", function () {
          expect(res.body.data.inviter._id).to.equal(
            bru.interpolate("{{userId}}")
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
