info:
  name: Get By ID - Invalid ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{URL}}/invitations/invalid_id"
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get Invitation with invalid ID, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Get Invitation with invalid ID returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Wrong object ID format");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
