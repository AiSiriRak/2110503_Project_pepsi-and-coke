info:
  name: Get By ID - Non-owner
  type: http
  seq: 4

http:
  method: GET
  url: "{{URL}}/invitations/{{invitationId}}"
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get Invitation as Non-owner, 403 Forbidden", function () {
          expect(res.status).to.equal(403);
        });

        test("Get Invitation as Non-owner returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("User is not authorized to access or modify this resource");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
