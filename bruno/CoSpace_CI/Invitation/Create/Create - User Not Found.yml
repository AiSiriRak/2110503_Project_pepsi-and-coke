info:
  name: Create - User Not Found
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/reservations/{{reservationId}}/invitations"
  body:
    type: json
    data: |-
      {
        "email": "nonexistent@example.com"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Invitation with non-existing user, 404 Not Found", function () {
          expect(res.status).to.equal(404);
        });

        test("Create Invitation with non-existing user returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("User not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
