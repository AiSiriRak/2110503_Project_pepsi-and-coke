info:
  name: Create - Self Invitation
  type: http
  seq: 5

http:
  method: POST
  url: "{{URL}}/reservations/{{reservationId}}/invitations"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Self Invitation, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create Self Invitation returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("You cannot invite yourself");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
