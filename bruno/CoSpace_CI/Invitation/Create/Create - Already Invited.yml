info:
  name: Create - Already Invited
  type: http
  seq: 6

http:
  method: POST
  url: "{{URL}}/reservations/{{reservationId}}/invitations"
  body:
    type: json
    data: |-
      {
        "email": "{{user2Email}}"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Invitation for existing Co-booker, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create Invitation for existing Co-booker returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("User has already been invited to this reservation.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
