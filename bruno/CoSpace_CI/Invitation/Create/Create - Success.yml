info:
  name: Create - Success
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/reservations/{{reservationId}}/invitations"
  body:
    type: json
    data: |-
      {
        "email": "{{user2Email}}"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Invitation success, 201 Created", function () {
          expect(res.status).to.equal(201);
        });

        test("Create Invitation returns success", function () {
          expect(res.body.success).to.equal(true);
        });

        test("Create Invitation returns invitation data", function () {
          expect(res.body.data).to.be.an("object");
          expect(res.body.data).to.have.property("_id");
          expect(res.body.data).to.have.property("reservation");
          expect(res.body.data).to.have.property("inviter");
          expect(res.body.data).to.have.property("recipient");
          expect(res.body.data).to.have.property("status");
        });

        test("Invitation data matches request", function () {
          expect(res.body.data.reservation).to.equal(bru.interpolate("{{reservationId}}"));
          expect(res.body.data.recipient).to.equal(bru.interpolate("{{user2ID}}"));
          expect(res.body.data.status).to.equal("pending");
        });

        // Save Invitation ID for subsequent requests
        bru.setEnvVar("invitationId", res.body.data._id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
