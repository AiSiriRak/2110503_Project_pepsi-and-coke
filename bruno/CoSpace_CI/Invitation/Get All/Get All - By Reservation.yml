info:
  name: Get All - By Reservation
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL}}/reservations/{{reservationId}}/invitations"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get All Invitations by Reservation success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        test("Get All Invitations by Reservation returns success", function () {
          expect(res.body.success).to.equal(true);
        });

        test("Get All Invitations by Reservation returns invitation list", function () {
          expect(res.body.count).to.equal(res.body.data.length);
          expect(res.body.data).to.be.an("array");
        });

        test("All invitations belong to requested Reservation", function () {
          const reservationId = bru.interpolate("{{reservationId}}");

          res.body.data.forEach((invitation) => {
            expect(invitation.reservation._id).to.equal(reservationId);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
