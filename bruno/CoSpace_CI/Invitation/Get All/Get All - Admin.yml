info:
  name: Get All - Admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/invitations"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get All Invitations success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        test("Get All Invitations returns success", function () {
          expect(res.body.success).to.equal(true);
        });

        test("Get All Invitations returns invitation list", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.count).to.be.a("number");
          expect(res.body.data).to.be.an("array");
          expect(res.body.count).to.equal(res.body.data.length);
        });

        test("Get All Invitations returns valid invitation data", function () {
          res.body.data.forEach((invitation) => {
            expect(invitation).to.have.property("_id");
            expect(invitation).to.have.property("status");
            expect(invitation).to.have.property("inviter");
            expect(invitation).to.have.property("recipient");
            expect(invitation).to.have.property("reservation");

            expect(invitation.inviter).to.be.an("object");
            expect(invitation.recipient).to.be.an("object");
            expect(invitation.reservation).to.be.an("object");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
