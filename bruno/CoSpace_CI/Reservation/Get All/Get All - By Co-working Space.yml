info:
  name: Get All - By Co-working Space
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL}}/coworking-spaces/{{coworkingSpaceId}}/reservations"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get All Reservations by Co-working Space success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        test("Get All Reservations by Co-working Space returns success", function () {
          expect(res.body.success).to.equal(true);
        });

        test("Get All Reservations by Co-working Space returns reservation list", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.count).to.be.a("number");
          expect(res.body.data).to.be.an("array");
          expect(res.body.count).to.equal(res.body.data.length);
        });

        test("Reservations belong to the requested Co-working Space", function () {
          const coworkingSpaceId = bru.getVar("coworkingSpaceId");

          res.body.data.forEach((reservation) => {
            expect(reservation.coworkingSpace._id).to.equal(coworkingSpaceId);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
