info:
  name: Get By ID - Invalid ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{URL}}/reservations/invalid_id"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get Reservation with invalid ID, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Get Reservation with invalid ID returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Wrong object ID format");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
