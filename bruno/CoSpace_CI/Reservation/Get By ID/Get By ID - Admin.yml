info:
  name: Get By ID - Admin
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/reservations/{{reservationId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get Reservation as Admin success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        test("Get Reservation as Admin returns success", function () {
          expect(res.body.success).to.equal(true);
        });

        test("Get Reservation as Admin returns reservation data", function () {
          expect(res.body.data).to.be.an("object");
          expect(res.body.data._id).to.equal(bru.getEnvVar("reservationId"));
          expect(res.body.data).to.have.property("invitations");
        });

        test("Admin can view all reservation invitations", function () {
          expect(res.body.data.invitations).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
