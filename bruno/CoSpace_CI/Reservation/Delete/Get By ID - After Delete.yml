info:
  name: Get By ID - After Delete
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/reservations/{{reservation2Id}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get Deleted Reservation, 404 Not Found", function () {
          expect(res.status).to.equal(404);
        });

        test("Deleted Reservation returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          
          const reservationId = bru.getEnvVar("reservation2Id");
          
          expect(res.body.message).to.be.a("string");
          expect(res.body.message).to.include(
            `Reservation not found with ID of ${reservationId}`
          );
        });

        console.log("Actual message:", JSON.stringify(res.body.message));
        console.log("Expected ID:", JSON.stringify(bru.getEnvVar("reservationId")));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
