info:
  name: Update - Non-existing ID
  type: http
  seq: 5

http:
  method: PUT
  url: "{{URL}}/reservations/000000000000000000000001"
  body:
    type: json
    data: |-
      {
        "reserveDate": "2026-10-31"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Update Reservation with non-existing ID, 404 Not Found", function () {
          expect(res.status).to.equal(404);
        });

        test("Update Reservation with non-existing ID returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal('Reservation not found with ID of 000000000000000000000001');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
