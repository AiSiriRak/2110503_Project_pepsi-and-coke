info:
  name: Update - Invalid ID
  type: http
  seq: 4

http:
  method: PUT
  url: "{{URL}}/reservations/invalid_id"
  body:
    type: json
    data: |-
      {
        "reserveDate": "2026-10-31"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Update Reservation with invalid ID, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Update Reservation with invalid ID returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Wrong object ID format");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
