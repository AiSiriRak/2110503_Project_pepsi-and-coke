info:
  name: Update - Non-owner
  type: http
  seq: 3

http:
  method: PUT
  url: "{{URL}}/reservations/{{reservationId}}"
  body:
    type: json
    data: |-
      {
        "reserveDate": "2026-10-31"
      }
  auth:
    type: bearer
    token: "{{user2Token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Update Reservation as Non-owner, 403 Forbidden", function () {
          expect(res.status).to.equal(403);
        });

        test("Update Reservation as Non-owner returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("User is not authorized to access or modify this resource");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
