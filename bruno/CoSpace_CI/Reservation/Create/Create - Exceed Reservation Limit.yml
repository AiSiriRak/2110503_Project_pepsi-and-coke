info:
  name: Create - Exceed Reservation Limit
  type: http
  seq: 8

http:
  method: POST
  url: "{{URL}}/coworking-spaces/{{CoworkingSpaceID}}/reservations"
  body:
    type: json
    data: |-
      {
          "reserveDate" : "{{reserveDate}}"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Generate reserve date
        const start = new Date('2025-01-01').getTime();
        const end = new Date('2027-12-31').getTime();

        const randomTimestamp = start + Math.random() * (end - start);
        const randomDate = new Date(randomTimestamp);

        const reserveDate = randomDate.toISOString().split('T')[0];
        bru.setVar('reserveDate', reserveDate);
    - type: after-response
      code: |-
        test("Create Reservation exceeding limit, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create Reservation exceeding limit returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal(
            `The user with ID ${bru.interpolate("{{userId}}")} has already made 3 reservations.`
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
