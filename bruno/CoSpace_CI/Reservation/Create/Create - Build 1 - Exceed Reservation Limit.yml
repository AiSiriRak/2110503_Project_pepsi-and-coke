info:
  name: Create - Build 1 - Exceed Reservation Limit
  type: http
  seq: 6

http:
  method: POST
  url: "{{URL}}/coworking-spaces/{{CoworkingSpaceID}}/reservations"
  body:
    type: json
    data: |-
      {
          "reserveDate" : "{{reserveDate}}"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Generate reserve date
        const start = new Date('2025-01-01').getTime();
        const end = new Date('2027-12-31').getTime();

        const randomTimestamp = start + Math.random() * (end - start);
        const randomDate = new Date(randomTimestamp);

        const reserveDate = randomDate.toISOString().split('T')[0];
        bru.setVar('reserveDate', reserveDate);
    - type: after-response
      code: bru.setEnvVar("reservation2Id", res.body.data._id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
