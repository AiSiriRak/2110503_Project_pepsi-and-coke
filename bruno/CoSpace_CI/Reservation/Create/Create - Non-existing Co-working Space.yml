info:
  name: Create - Non-existing Co-working Space
  type: http
  seq: 4

http:
  method: POST
  url: "{{URL}}/coworking-spaces/000000000000000000000001/reservations"
  body:
    type: json
    data: |-
      {
          "reserveDate" : "2026-11-01"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Reservation with non-existing Co-working Space, 404 Not Found", function () {
          expect(res.status).to.equal(404);
        });

        test("Create Reservation returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal('Coworking space not found with ID of 000000000000000000000001');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
