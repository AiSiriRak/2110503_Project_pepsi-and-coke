info:
  name: Create - Duplicate Reservation
  type: http
  seq: 5

http:
  method: POST
  url: "{{URL}}/coworking-spaces/{{CoworkingSpaceID}}/reservations"
  body:
    type: json
    data: |-
      {
          "reserveDate" : "{{reserveDate}}"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Duplicate Reservation, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create Duplicate Reservation returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal('This co-working space is already reserved for the selected date.');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
