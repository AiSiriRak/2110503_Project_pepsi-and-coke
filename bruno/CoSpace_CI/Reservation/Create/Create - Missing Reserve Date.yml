info:
  name: Create - Missing Reserve Date
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/coworking-spaces/{{CoworkingSpaceID}}/reservations"
  body:
    type: json
    data: |-
      {
          "reserveDate" : ""
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Reservation without reserve date, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create Reservation returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Please add a reserve date.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
