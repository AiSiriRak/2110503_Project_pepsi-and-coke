info:
  name: Create - Invalid Reserve Date Format
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/coworking-spaces/{{CoworkingSpaceID}}/reservations"
  body:
    type: json
    data: |-
      {
          "reserveDate" : "2026-11-1"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create Reservation with invalid date format, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create Reservation returns error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Please use YYYY-MM-DD format for reserve date.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
