info:
  name: Delete - Invalid ID
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{URL}}/coworking-spaces/invalid_id"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Delete coworking space with invalid ID returns 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Delete coworking space with invalid ID returns error message", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Wrong object ID format");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
