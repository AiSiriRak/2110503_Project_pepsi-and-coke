info:
  name: Delete - Check delete result
  type: http
  seq: 4

http:
  method: GET
  url: "{{URL}}/coworking-spaces/{{coworkingSpaceId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Deleted coworking space cannot be retrieved, 404 Not Found", function () {
          expect(res.status).to.equal(404);
        });

        test("Deleted coworking space returns error response", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
