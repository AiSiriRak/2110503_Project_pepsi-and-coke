info:
  name: Update - Invalid ID
  type: http
  seq: 2

http:
  method: PUT
  url: "{{URL}}/coworking-spaces/invalid_id"
  body:
    type: json
    data: |-
      {
        "name": "Replace Name",
        "maximumCapacity": 1
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Update coworking space with invalid ID returns 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Update coworking space with invalid ID returns error message", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Wrong object ID format");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
