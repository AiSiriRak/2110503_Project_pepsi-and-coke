info:
  name: Create - Invalid Data
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/coworking-spaces"
  body:
    type: json
    data: |-
      {
        "name": "Liverpool Space",
        "address": "Liverpool",
        "telephoneNumber": "067676767",
        "openTime": "08:30",
        "closeTime": "17:00",
        "maximumCapacity": 0
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create coworking space with invalid capacity, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create coworking space returns capacity validation error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Capacity must be at least 1.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
