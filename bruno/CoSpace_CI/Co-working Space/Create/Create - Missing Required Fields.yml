info:
  name: Create - Missing Required Fields
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/coworking-spaces"
  body:
    type: json
    data: |-
      {
        "name": "",
        "address": "Liverpool",
        "telephoneNumber": "067676767",
        "openTime": "08:30",
        "closeTime": "17:00",
        "maximumCapacity": 4
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Create coworking space with missing name, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Create coworking space returns name validation error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Please add a name.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
