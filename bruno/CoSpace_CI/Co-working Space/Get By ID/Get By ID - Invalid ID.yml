info:
  name: Get By ID - Invalid ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/coworking-spaces/invalid_id"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get coworking space with invalid ID returns 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Get coworking space with invalid ID returns correct error", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Wrong object ID format");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
