info:
  name: Get All - Pagination
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/coworking-spaces?page=2&limit=10"
  params:
    - name: page
      value: "2"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get coworking spaces with pagination success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        test("Get coworking spaces returns correct pagination data", function () {
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.be.an("array");
          expect(res.body.data.length).to.be.at.most(10);
          expect(res.body.count).to.equal(res.body.data.length);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
