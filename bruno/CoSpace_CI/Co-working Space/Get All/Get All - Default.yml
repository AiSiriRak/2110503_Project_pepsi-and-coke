info:
  name: Get All - Default
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/coworking-spaces"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get all coworking spaces success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        test("Get all coworking spaces returns correct response structure", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.success).to.equal(true);

          expect(res.body.count).to.be.a("number");
          expect(res.body.pagination).to.be.an("object");
          expect(res.body.data).to.be.an("array");
        });

        test("Get all coworking spaces uses default pagination", function () {
          expect(res.body.data.length).to.be.at.most(25);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
