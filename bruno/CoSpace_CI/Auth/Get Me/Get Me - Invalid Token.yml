info:
  name: Get Me - Invalid Token
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/auth/me"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Get me success, 401 Unauthorized", function () {
          expect(res.status).to.equal(401);
        });

        test("Error message: not authorized", function () {
          expect(res.body.message).to.equal("Not authorize to access this route");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
