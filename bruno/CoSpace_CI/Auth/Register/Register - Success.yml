info:
  name: Register - Success
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "{{username}}",
        "telephoneNumber": "{{telephoneNumber}}",
        "email": "{{email}}",
        "password": "{{password}}",
        "role": "user"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Generate a username
        const username = bru.interpolate('{{$randomUserName}}');
        bru.setVar("username", username);

        // Generate an email
        const email = bru.interpolate('{{$randomEmail}}').toLowerCase();
        bru.setVar("email", email);

        // Generate a password
        const password = bru.interpolate('{{$randomPassword}}');
        bru.setVar("password", password);

        // Generate a Thai telephone number
        const prefixes = ['06', '08', '09'];
        const randomPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];
        const randomNumber = Math.floor(10000000 + Math.random() * 90000000);
        const thaiPhone = `${randomPrefix}${randomNumber}`;
        bru.setVar("telephoneNumber", thaiPhone);
    - type: after-response
      code: |-
        test("Register success, 201 Created", function () {
          expect(res.status).to.equal(201);
        });

        test("Register returns response body", function () {
          expect(res.body).to.be.an("object");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
