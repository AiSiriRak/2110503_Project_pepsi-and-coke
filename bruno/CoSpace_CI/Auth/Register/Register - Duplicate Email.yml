info:
  name: Register - Duplicate Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "{{username}}",
        "telephoneNumber": "{{telephoneNumber}}",
        "email": "{{email}}",
        "password": "{{password}}",
        "role": "user"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Register fail, 400 Bad Request", function () {
          expect(res.status).to.equal(400);
        });

        test("Error message: Duplicate email", function () {
          expect(res.body.message).to.equal("Email is already registered.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
