info:
  name: Login - Wrong Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Login fail, 401 Unauthorized", function () {
          expect(res.status).to.equal(401);
        });

        test("Error message: Invalid credentials", function () {
          expect(res.body.message).to.equal("Invalid credentials");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
