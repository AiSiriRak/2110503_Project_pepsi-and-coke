info:
  name: Login - User Success
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Login success, 200 OK", function () {
          expect(res.status).to.equal(200);
        });

        if (res.status === 200) {
          bru.setVar("userToken", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
